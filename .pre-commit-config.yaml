repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        exclude: tests/.*
        # Run from the project's locked environment so mypy sees the real,
        # py.typed types of every dependency (zarr-cm, pydantic, ...) instead
        # of treating them as Any. Staged files are passed through, matching
        # the previous hook's per-file scope.
